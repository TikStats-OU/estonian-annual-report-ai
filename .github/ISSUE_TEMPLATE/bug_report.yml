name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include real financial records, personal data, credentials, or customer documents. Replace them with synthetic examples."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include minimal steps or synthetic input.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and Python version
    validations:
      required: true
