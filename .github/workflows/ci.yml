name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly dependency audit, even without new commits.
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: ruff check src mcp tests examples scripts
      - run: python scripts/check_privacy.py
      - run: python scripts/check_docs.py

  package:
    name: Package, container, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: docker build --tag estonian-annual-report-ai:ci .
      - run: pip-audit --skip-editable
