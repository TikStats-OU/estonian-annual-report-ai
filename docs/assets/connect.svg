<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="276" viewBox="0 0 1000 276" role="img" aria-labelledby="title desc">
  <title id="title">Connect FlaiReport to Claude or Codex in about two minutes</title>
  <desc id="desc">A Claude icon on the left and a Codex icon on the right connect to FlaiReport in the middle; data dots travel along both links and a Connected badge appears.</desc>
  <defs>
    <style>
      .title { fill: #f3f7fa; font: 700 26px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
      .sub { fill: #8fa6b6; font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
      .name { fill: #f3f7fa; font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
      .cmd { fill: #b9d7cc; font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; }
      .ok { fill: #081521; font: 700 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .link { stroke: #2b4a5f; stroke-width: 3; stroke-dasharray: 6 8; fill: none; }
    </style>
  </defs>
  <rect width="1000" height="276" rx="22" fill="#081521"/>

  <text class="title" x="500" y="46">Connect to Claude or Codex in about 2 minutes</text>
  <text class="sub" x="500" y="72">One command, no clone, no server to host. Everything runs on your computer.</text>

  <!-- Moving dashes on both links -->
  <path class="link" d="M222 150H426"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></path>
  <path class="link" d="M574 150H778"><animate attributeName="stroke-dashoffset" from="0" to="28" dur="1s" repeatCount="indefinite"/></path>
  <g fill="#f5c46b">
    <circle r="5" cx="222" cy="150"><animate attributeName="cx" values="222;426" dur="2s" repeatCount="indefinite"/></circle>
    <circle r="5" cx="778" cy="150"><animate attributeName="cx" values="778;574" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Claude: warm rounded tile with a radial burst -->
  <g transform="translate(110 100)">
    <rect width="100" height="100" rx="24" fill="#2a1a14" stroke="#d97757" stroke-width="2"/>
    <g transform="translate(50 50)" stroke="#d97757" stroke-width="7" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0 0 0;45 0 0;45 0 0" keyTimes="0;.3;1" dur="4s" repeatCount="indefinite" additive="sum"/>
      <path d="M0-28V28M-28 0H28M-20-20 20 20M-20 20 20-20"/>
    </g>
    <text class="name" x="50" y="128">Claude</text>
    <text class="cmd" x="50" y="148">claude mcp add …</text>
  </g>

  <!-- FlaiReport in the middle -->
  <g transform="translate(436 96)">
    <rect width="128" height="108" rx="26" fill="#102235" stroke="#55c2a3" stroke-width="2"/>
    <g transform="translate(33 14) scale(.36)">
      <path d="M64 36h60l34 34v105a12 12 0 0 1-12 12H64a12 12 0 0 1-12-12V48a12 12 0 0 1 12-12Z" fill="#081521" stroke="#55c2a3" stroke-width="9"/>
      <path d="M76 92h58M76 112h34" stroke="#a9bfce" stroke-width="11" stroke-linecap="round"/>
      <path d="M83 151h18m10 0h18" stroke="#f5c46b" stroke-width="12" stroke-linecap="round"/>
    </g>
    <text class="name" x="64" y="100" font-size="15">FlaiReport</text>
  </g>

  <!-- Codex: dark tile with a terminal prompt -->
  <g transform="translate(790 100)">
    <rect width="100" height="100" rx="24" fill="#0f1720" stroke="#e6edf3" stroke-width="2"/>
    <path d="m26 36 18 14-18 14" fill="none" stroke="#e6edf3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M52 66h22" stroke="#e6edf3" stroke-width="7" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <text class="name" x="50" y="128">Codex</text>
    <text class="cmd" x="50" y="148">codex mcp add …</text>
  </g>

  <g transform="translate(441 214)">
    <rect width="118" height="28" rx="14" fill="#55c2a3">
      <animate attributeName="opacity" values=".55;1;.55" dur="2s" repeatCount="indefinite"/>
    </rect>
    <path d="m14 14 5 5 10-10" fill="none" stroke="#081521" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="ok" x="36" y="19">Connected</text>
  </g>
</svg>
