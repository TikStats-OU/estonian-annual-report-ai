<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">FlaiReport</title>
  <desc id="desc">Animated banner: bank, Stripe, and invoice files flow into a double-entry ledger that ends balanced. Synthetic example values.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#55c2a3" stroke-opacity=".07"/>
    </pattern>
    <style>
      .title { fill: #f3f7fa; font: 700 64px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -1px; }
      .lead { fill: #d6e2ea; font: 500 25px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .sub { fill: #8fa6b6; font: 400 18px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .chip { fill: #102235; stroke: #2b4a5f; }
      .chiptext { fill: #b9d7cc; font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .file { fill: #102235; stroke: #55c2a3; stroke-width: 1.5; }
      .filetext { fill: #f3f7fa; font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .mono { fill: #d6e2ea; font: 500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .head { fill: #8fa6b6; font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1px; }
      .ok { fill: #081521; font: 700 16px system-ui, -apple-system, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="400" rx="28" fill="#081521"/>
  <rect width="1280" height="400" rx="28" fill="url(#grid)"/>

  <!-- Brand mark -->
  <g transform="translate(64 64) scale(.5)">
    <path d="M64 36h60l34 34v105a12 12 0 0 1-12 12H64a12 12 0 0 1-12-12V48a12 12 0 0 1 12-12Z" fill="#102235" stroke="#55c2a3" stroke-width="7"/>
    <path d="M124 38v31a5 5 0 0 0 5 5h28" fill="none" stroke="#55c2a3" stroke-width="7"/>
    <path d="M76 92h58M76 112h34" stroke="#a9bfce" stroke-width="9" stroke-linecap="round"/>
    <path d="M83 151h18m10 0h18" stroke="#f5c46b" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text class="title" x="168" y="132">FlaiReport</text>
  <text class="lead" x="64" y="206">Estonian annual reports, with every figure traceable.</text>
  <text class="sub" x="64" y="242">Local-first MCP toolkit · double-entry ledger · you approve every judgment call</text>

  <g transform="translate(64 284)">
    <rect class="chip" width="132" height="36" rx="18"/><text class="chiptext" x="66" y="23" text-anchor="middle">Runs locally</text>
    <rect class="chip" x="146" width="148" height="36" rx="18"/><text class="chiptext" x="220" y="23" text-anchor="middle">Decimal money</text>
    <rect class="chip" x="308" width="132" height="36" rx="18"/><text class="chiptext" x="374" y="23" text-anchor="middle">35 MCP tools</text>
    <rect class="chip" x="454" width="120" height="36" rx="18"/><text class="chiptext" x="514" y="23" text-anchor="middle">Apache-2.0</text>
  </g>

  <!-- Files flowing into the ledger -->
  <g>
    <rect class="file" x="800" y="96" width="132" height="40" rx="10"/><text class="filetext" x="866" y="121" text-anchor="middle">bank.csv</text>
    <rect class="file" x="800" y="180" width="132" height="40" rx="10"/><text class="filetext" x="866" y="205" text-anchor="middle">stripe.csv</text>
    <rect class="file" x="800" y="264" width="132" height="40" rx="10"/><text class="filetext" x="866" y="289" text-anchor="middle">invoice.pdf</text>
  </g>
  <g fill="#f5c46b">
    <circle r="5" cx="940" cy="116" opacity="0">
      <animate id="loop" attributeName="opacity" values="0;1;1;0" dur="1.2s" begin="0s;loop.begin+8s"/>
      <animate attributeName="cx" from="940" to="1000" dur="1.2s" begin="loop.begin"/>
    </circle>
    <circle r="5" cx="940" cy="200" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" dur="1.2s" begin="loop.begin+1.4s"/>
      <animate attributeName="cx" from="940" to="1000" dur="1.2s" begin="loop.begin+1.4s"/>
    </circle>
    <circle r="5" cx="940" cy="284" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" dur="1.2s" begin="loop.begin+2.8s"/>
      <animate attributeName="cx" from="940" to="1000" dur="1.2s" begin="loop.begin+2.8s"/>
    </circle>
  </g>

  <g transform="translate(1008 72)">
    <rect width="232" height="256" rx="16" fill="#102235" stroke="#55c2a3" stroke-width="2"/>
    <text class="head" x="18" y="32">LEDGER · EUR</text>
    <text class="head" x="122" y="58">DR</text><text class="head" x="186" y="58">CR</text>
    <path d="M14 68h204" stroke="#2b4a5f"/>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.9;1" dur="8s" begin="loop.begin+1.1s"/>
      <text class="mono" x="18" y="94">Bank</text><text class="mono" x="166" y="94" text-anchor="end">100</text>
      <text class="mono" x="18" y="116">Sales</text><text class="mono" x="214" y="116" text-anchor="end">100</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.07;.9;1" dur="6.6s" begin="loop.begin+2.5s"/>
      <text class="mono" x="18" y="144">Fees</text><text class="mono" x="166" y="144" text-anchor="end">3</text>
      <text class="mono" x="18" y="166">Bank</text><text class="mono" x="214" y="166" text-anchor="end">3</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.09;.88;1" dur="5.2s" begin="loop.begin+3.9s"/>
      <text class="mono" x="18" y="194">Hosting</text><text class="mono" x="166" y="194" text-anchor="end">20</text>
      <text class="mono" x="18" y="216">Bank</text><text class="mono" x="214" y="216" text-anchor="end">20</text>
    </g>
  </g>
  <g transform="translate(1062 342)" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="3.4s" begin="loop.begin+4.6s"/>
    <rect width="124" height="34" rx="17" fill="#55c2a3"/>
    <path d="m18 17 6 6 12-12" fill="none" stroke="#081521" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="ok" x="46" y="23">Balanced</text>
  </g>
</svg>
